name: Aggiorna estrazioni SuperEnalotto

on:
  schedule:
    - cron: '25 19,20,21 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: super6-auto-draws
  cancel-in-progress: true

jobs:
  update-draws:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: script/requirements-super6.txt

      - name: Installa dipendenze
        run: |
          python -m pip install --upgrade pip
          pip install -r script/requirements-super6.txt
          python -m playwright install --with-deps chromium

      - name: Controlla archivio SuperEnalotto
        run: python script/update_superenalotto.py

      - name: Salva eventuale nuova estrazione
        run: |
          if git diff --quiet -- data/draws-auto.json; then
            echo "Nessuna nuova estrazione."
            exit 0
          fi

          git config user.name "super6-auto"
          git config user.email "actions@users.noreply.github.com"
          git add data/draws-auto.json
          git commit -m "Aggiorna estrazioni SuperEnalotto"
          git push
